[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "oa-detection"
version = "0.1.0"
description = "Osteoarthritis Detection Research System using deep learning on knee X-rays."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OA Detection Team" }]
keywords = ["medical-imaging", "osteoarthritis", "deep-learning", "xray"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pydicom>=2.4.0",
    "streamlit>=1.28.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
    "weasyprint>=60.0",
    "timm>=0.9.0",
    "albumentations>=1.3.0",
    "fpdf2>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "black>=23.10.0",
]

[project.urls]
Homepage = "https://github.com/your-org/oa-detection"
Repository = "https://github.com/your-org/oa-detection"

[tool.setuptools.packages.find]
where = ["."]
include = ["preprocessing*", "models*", "inference*", "training*", "evaluation*", "app*", "reports*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-report=html:coverage_html"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
